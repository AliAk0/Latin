<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#14181F">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Statio Latina">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%2314181F'/><text x='50' y='70' font-size='58' text-anchor='middle' fill='%23D2A64B' font-family='serif' font-weight='bold'>L</text></svg>">
<title>Statio Latina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Rubik:ital,wght@0,300;0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#14181F; --panel:#1D2430; --panel2:#232C3A; --line:#2C3646;
  --ink:#F0EBE0; --muted:#8C95A6; --brass:#D2A64B;
  --b1:#4A7FB5; --b2:#4E9B5E; --b3:#C9B23D; --b4:#D07B3A; --b5:#C8503C; --b6:#8E6BB0; --b7:#8A6A4F;
  --ok:#4E9B5E; --bad:#C8503C;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Rubik',sans-serif;min-height:100vh;line-height:1.5}
.streak{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 12px;text-align:center;min-width:70px}
.streak b{font-family:'Cinzel',serif;font-size:1.1rem;color:var(--brass)}
.streak span{display:block;font-size:.62rem;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
section{display:none;padding:8px 0 40px}
section.show{display:block}
h3{font-size:.95rem;margin:12px 0 8px;font-weight:600}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
.muted{color:var(--muted);font-size:.85rem}
.btn{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 16px;font-family:'Rubik';font-size:.9rem;cursor:pointer;transition:.15s}
.btn:hover{border-color:var(--brass)}
.btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.btn.gold{background:var(--brass);color:#14181F;border-color:var(--brass);font-weight:600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.la{font-weight:600}
.et{color:var(--muted);font-size:.8rem;font-style:italic}
/* metro map */
.metro{position:relative;padding:26px 4px 10px;overflow-x:auto}
.mline{display:flex;align-items:flex-start;min-width:560px}
.mst{flex:1;position:relative;text-align:center;cursor:pointer}
.mst .dot{width:26px;height:26px;border-radius:50%;margin:0 auto;border:4px solid var(--line);background:var(--bg);position:relative;z-index:2;transition:.2s}
.mst.open .dot{border-color:var(--st)}
.mst.done .dot{background:var(--st);border-color:var(--st)}
.mst.done .dot::after{content:'✓';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#14181F;font-weight:700;font-size:.8rem}
.mst.lock .dot::after{content:'🔒';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;opacity:.7}
.mst::before{content:'';position:absolute;top:11px;left:-50%;width:100%;height:4px;background:var(--line);z-index:1}
.mst:first-child::before{display:none}
.mst.open::before,.mst.done::before{background:var(--st)}
.mst .lbl{margin-top:8px;font-size:.72rem;line-height:1.25}
.mst .lbl b{display:block;font-family:'Cinzel',serif;font-size:.78rem}
.mst .lbl span{color:var(--muted)}
/* module grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mod{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:.15s;text-align:left;color:var(--ink);font-family:'Rubik'}
.mod:hover{border-color:var(--brass);transform:translateY(-2px)}
.mod .ic{font-size:1.5rem}
.mod b{display:block;margin-top:6px;font-size:.9rem}
.mod span{font-size:.74rem;color:var(--muted)}
/* flashcard */
.fcard{background:var(--panel2);border:2px solid var(--line);border-radius:18px;min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;cursor:pointer}
.fcard .big{font-size:1.9rem;font-weight:700}
.fcard .tr{color:var(--brass);font-size:1.1rem}
/* quiz */
.opt{display:block;width:100%;text-align:left;margin:6px 0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-family:'Rubik';font-size:.95rem;color:var(--ink);cursor:pointer}
.opt:hover{border-color:var(--brass)}
.opt.right{background:rgba(78,155,94,.25);border-color:var(--ok)}
.opt.wrong{background:rgba(200,80,60,.25);border-color:var(--bad)}
input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;color:var(--ink);font-size:1rem;font-family:'Rubik'}
input[type=text]:focus{outline:2px solid var(--brass);border-color:var(--brass)}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--brass);transition:.3s}
.bigla{font-size:1.4rem;font-weight:600;line-height:1.5;text-align:center;padding:16px 6px}
.tag{font-size:.68rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--brass);font-weight:600}
.errit{border-left:3px solid var(--bad);padding:8px 12px;margin:8px 0;background:var(--panel2);border-radius:0 10px 10px 0}
.errit.clr{border-left-color:var(--ok);opacity:.55}
.dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:middle}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.chipArea{min-height:56px;background:var(--bg);border:2px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;margin:8px 0}
.chipArea.filled{border-style:solid;border-color:var(--brass)}
.chip{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:1rem;cursor:pointer;transition:.12s;font-family:'Rubik';color:var(--ink)}
.chip:hover{border-color:var(--brass)}
.chip:active{transform:scale(.94)}
.chip.used{opacity:.25;pointer-events:none}
.chip.ok{background:rgba(78,155,94,.3);border-color:var(--ok)}
.chip.no{background:rgba(200,80,60,.3);border-color:var(--bad)}
.res{font-family:'Cinzel',serif;font-size:2rem;text-align:center;padding:10px}
.timer{font-family:'Cinzel',serif;color:var(--brass)}
footer{border-top:1px solid var(--line);padding:14px 0 30px;color:var(--muted);font-size:.75rem;text-align:center}
/* günlük halka */
.ring{position:relative;width:62px;height:62px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .rtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.ring .rtxt b{font-family:'Cinzel',serif;font-size:.95rem;color:var(--brass)}
.ring .rtxt span{font-size:.55rem;color:var(--muted);letter-spacing:.5px}
/* görev listesi */
.task{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:none}
.task .tick{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:.7rem}
.task.done .tick{background:var(--ok);border-color:var(--ok);color:#14181F;font-weight:700}
.task.done .tlbl{opacity:.5;text-decoration:line-through}
.tlbl{flex:1;font-size:.88rem}
.tsub{font-size:.72rem;color:var(--muted)}
/* nag */
.nag{background:linear-gradient(135deg,rgba(200,80,60,.18),rgba(210,166,75,.12));border:1px solid var(--bad);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.nag b{color:var(--bad)}
.nag.ok{background:rgba(78,155,94,.12);border-color:var(--ok)}
.nag.ok b{color:var(--ok)}
/* istatistik */
.bars{display:flex;align-items:flex-end;gap:6px;height:110px;padding:6px 0}
.bars .bcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bars .bar{width:100%;background:var(--brass);border-radius:4px 4px 0 0;min-height:3px;transition:.3s}
.bars .bar.z{background:var(--line)}
.bars .bl{font-size:.63rem;color:var(--muted)}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-family:'Cinzel',serif;font-size:1.35rem;color:var(--brass);line-height:1.2}
.stat span{font-size:.7rem;color:var(--muted)}
.noteit{background:var(--panel2);border-left:3px solid var(--brass);border-radius:0 10px 10px 0;padding:9px 12px;margin:6px 0;font-size:.87rem}
.noteit .nd{font-size:.68rem;color:var(--muted);margin-bottom:3px}
.rule{background:var(--panel2);border-left:3px solid var(--brass);border-radius:0 10px 10px 0;padding:9px 12px;margin:6px 0}
.rule b.rt{color:var(--brass);font-size:.85rem}
.rule div{font-size:.88rem;margin-top:3px}
/* çekim tabloları */
.tbl{width:100%;border-collapse:collapse;font-size:.86rem;margin-top:8px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:6px 4px;text-align:left}
.tbl th{color:var(--muted);font-weight:500;font-size:.72rem}
.tbl td.lk{color:var(--line)}
.tbl td.f{font-weight:600}
/* okuma parçası */
.ltext{font-size:1.12rem;line-height:2.1}
.tok{cursor:pointer;border-bottom:1px dotted var(--muted);padding:0 1px;border-radius:3px}
.tok.on{color:#14181F;background:var(--brass);border-color:var(--brass)}
.gloss{position:sticky;top:70px;z-index:5;background:var(--panel2);border:1px solid var(--brass);border-radius:10px;padding:10px 12px;margin-bottom:10px;min-height:44px;font-size:.9rem}
/* kabuk */
.wrap{max-width:860px;margin:0 auto;padding:0 16px 96px}
header{position:sticky;top:0;z-index:40;background:var(--bg);display:flex;align-items:center;gap:10px;padding:12px 0 10px;border-bottom:1px solid var(--line)}
.backB{background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:10px;width:34px;height:34px;flex:0 0 auto;font-size:1rem;cursor:pointer;display:none;align-items:center;justify-content:center}
.backB.on{display:flex}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-family:'Cinzel',serif;font-size:1rem;letter-spacing:.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle span{display:block;font-size:.66rem;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -4px 18px rgba(0,0,0,.35)}
.tabbar button{flex:1;background:none;border:none;color:var(--muted);font-family:'Rubik';font-size:.68rem;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;border-radius:10px}
.tabbar button .ti{font-size:1.25rem;line-height:1}
.tabbar button.act{color:var(--brass)}
.tabbar .dot{position:absolute;top:3px;right:50%;margin-right:-16px;width:8px;height:8px;border-radius:50%;background:var(--bad);display:none}
.tabbar .dot.on{display:block}
.hubsec{font-size:.68rem;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);margin:16px 0 8px;font-weight:600}
.hitem{display:flex;align-items:center;gap:12px;width:100%;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:8px;cursor:pointer;text-align:left;transition:.15s;color:var(--ink);font-family:'Rubik'}
.hitem:hover{border-color:var(--brass)}
.hitem:active{transform:scale(.985)}
.hitem .hic{font-size:1.4rem;width:34px;text-align:center;flex:0 0 auto}
.hitem .htx{flex:1;min-width:0}
.hitem .htx b{display:block;font-size:.95rem}
.hitem .htx span{display:block;font-size:.75rem;color:var(--muted)}
.hitem .harr{color:var(--muted);font-size:1.1rem}
.hitem .hbadge{background:var(--bad);color:#fff;border-radius:999px;font-size:.68rem;padding:2px 8px;font-weight:600}
.hitem .hbadge.ok{background:var(--ok)}
.contB{width:100%;background:linear-gradient(135deg,var(--brass),#B8923F);color:#14181F;border:none;border-radius:16px;padding:16px;font-family:'Rubik';font-weight:700;font-size:1rem;cursor:pointer;display:flex;align-items:center;gap:12px;text-align:left;margin-bottom:12px}
.contB .cic{font-size:1.6rem}
.contB small{display:block;font-weight:400;font-size:.76rem;opacity:.8}
@media(max-width:520px){.fcard .big{font-size:1.5rem}.bigla{font-size:1.15rem}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <button class="backB" id="backB" onclick="goBack()">←</button>
  <div class="htitle"><b id="hTitle">STATIO LATINA</b><span id="hSub">Latince Antrenman İstasyonu</span></div>
  <div class="streak"><b id="stCount">0</b><span>🔥 seri</span></div>
  <div class="ring" id="dayRing"></div>
</header>

<!-- ============ HOME ============ -->
<section id="home" class="show">
  <div id="nagArea"></div>
  <div id="contArea"></div>
  <div class="hubsec">Bugünün Görevi</div>
  <div class="card" id="dailyCard"></div>
  <div class="hubsec">Nerede Kaldın</div>
  <div class="card" id="homeProgress"></div>
</section>

<!-- ============ ÇALIŞ HUB ============ -->
<section id="study">
  <div class="hubsec">Müfredat</div>
  <button class="hitem" onclick="nav('map')"><span class="hic">🚇</span><span class="htx"><b>Hat Haritası</b><span id="hiMap">Bloklar ve bölümler</span></span><span class="harr">›</span></button>
  <button class="hitem" onclick="nav('reading')"><span class="hic">📜</span><span class="htx"><b>Okuma Parçası</b><span>Blok sonu metinleri · kelimeye dokun</span></span><span class="harr">›</span></button>
  <div class="hubsec">Antrenman</div>
  <button class="hitem" onclick="nav('cards')"><span class="hic">📇</span><span class="htx"><b>Kelime Kartları</b><span>SRS aralıklı tekrar · etimoloji</span></span><span class="hbadge" id="hiCards"></span><span class="harr">›</span></button>
  <button class="hitem" onclick="nav('decl')"><span class="hic">🏛️</span><span class="htx"><b>Çekim Drilli</b><span>İsim halleri · fiil ekleri · tablolar</span></span><span class="harr">›</span></button>
  <button class="hitem" onclick="nav('sprint')"><span class="hic">⚡</span><span class="htx"><b>Sprint</b><span>Çeviri · hata avı · tamamlama · cümle kurma</span></span><span class="harr">›</span></button>
  <button class="hitem" onclick="nav('errors')"><span class="hic">⚠️</span><span class="htx"><b>Hata Defteri</b><span>Kişisel hataların</span></span><span class="hbadge" id="hiErr"></span><span class="harr">›</span></button>
</section>

<!-- ============ HAT HARİTASI ============ -->
<section id="map">
  <div class="card metro"><div class="mline" id="metroMap"></div></div>
  <div class="card" id="blockDetail"></div>
</section>

<!-- ============ KARTLAR ============ -->
<section id="cards">
  <p class="muted" id="cardMeta"></p>
  <div id="cardArea"></div>
</section>

<!-- ============ ÇEKİM ============ -->
<section id="decl">
  <div class="row" style="margin-bottom:10px">
    <button class="btn" id="dcNoun">İsim Halleri</button>
    <button class="btn" id="dcVerb">Fiil Ekleri</button>
    <button class="btn" id="dcTbl">📋 Tablolar</button>
  </div>
  <div id="declArea"></div>
</section>

<!-- ============ OKUMA ============ -->
<section id="reading">
  <div id="readingArea"></div>
</section>

<!-- ============ HATALAR ============ -->
<section id="errors">
  <p class="muted">Tekrarlayan hataların. 3 kez üst üste doğru → listeden düşer.</p>
  <div class="row" style="margin:10px 0">
    <button class="btn gold" id="errDrillBtn">Drill Başlat</button>
    <button class="btn ghost" id="errAddBtn">+ Hata Ekle</button>
  </div>
  <div id="errList"></div>
  <div id="errDrillArea"></div>
</section>

<!-- ============ SPRINT ============ -->
<section id="sprint">
  <div class="row" style="margin-bottom:10px">
    <button class="btn" id="spTrans">Çeviri Sprinti</button>
    <button class="btn" id="spHunt">Hata Avı</button>
    <button class="btn" id="spFill">Cümle Tamamlama</button>
    <button class="btn" id="spBuild">🧩 Cümle Kurma</button>
  </div>
  <div id="sprintArea"></div>
</section>

<!-- ============ SINAV ============ -->
<section id="exam">
  <div class="row" style="margin-bottom:12px">
    <button class="btn" id="tabBlock">🚇 Blok Sınavı</button>
    <button class="btn" id="tabCum">📚 Kümülatif</button>
    <button class="btn" id="tabWeak">🎯 Zayıf Noktalar</button>
  </div>
  <div id="examArea"></div>
</section>

<!-- ============ İSTATİSTİK ============ -->
<section id="stats">
  <div id="statsArea"></div>
</section>

<footer>Statio Latina • 6 blok / 30 bölüm + İleri Hat • LLPSI çizgisi • klasik telaffuz • okuma pratiği için Claude'a dön</footer>
</div>

<div class="tabbar" id="tabbar">
  <button data-t="home"><span class="ti">🏠</span>Ana<span class="dot" id="dHome"></span></button>
  <button data-t="study"><span class="ti">📚</span>Çalış<span class="dot" id="dStudy"></span></button>
  <button data-t="exam"><span class="ti">🎓</span>Sınav</button>
  <button data-t="stats"><span class="ti">📊</span>İstatistik</button>
</div>

/* uzunluk işaretlerini ve noktalamayı yok sayar */
function norm(t){return t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[.,!?;:—\-'"«»]/g,'').replace(/\s+/g,' ').trim()}
const stripP=w=>w.replace(/[.,!?;:«»]/g,'');
const EMPTY_MSG='<div class="card" style="text-align:center">Henüz malzeme yok.<br><span class="muted">Önce Bölüm 1\'i bitir: 🚇 Hat Haritası → 📖 Çalış → 🎯 Test</span></div>';

/* ===== Çeldirici üretimi: aynı kelimenin yanlış ekli halleri ===== */
const GROUPS=[
 ['est','sunt'],['Estne','Suntne','Est'],['in','ex','ab','cum','sine'],['et','sed','quia'],
 ['quis','quem','cuius','quid'],['ubi','cūr','quid'],
 ['venit','veniunt','venī','venīte'],['tacē','tacēte','tacet'],['audī','audīte','audit','audiunt'],
 ['vocā','vocāte','vocat','vocant'],['habet','habent','habē','habēte'],['carpit','carpunt','carpe','carpite'],
 ['adest','abest','adsunt'],['meus','mea','meum','tuus','tua'],['tuus','tua','tuum','meus']
];
const FUNC=new Set(['et','sed','non','quia','quoque','ubi','cur','quid','quem','quis','cuius','ecce','sine','cum','ex','e','ab','a','in','est','sunt','salve','vale','age','centum','duo','tres']);
const PREP=new Set(['in','ex','e','ab','a','cum','sine']);
const CONJ=new Set(['et','sed','quia']);
const QW=new Set(['ubi','cur','quid','quem','quis','cuius']);
const ENDS=[
 [/^(.+)ōrum$/,['us','ī','ōs','īs']],[/^(.+)ārum$/,['a','ae','ās','īs']],
 [/^(.+)āte$/,['ā','at','ant']],[/^(.+)ēte$/,['ē','et','ent']],[/^(.+)īte$/,['ī','it','iunt']],
 [/^(.+)ant$/,['at','ā','āte']],[/^(.+)ent$/,['et','ē','ēte']],[/^(.+)unt$/,['it','e','ite']],
 [/^(.+)at$/,['ant','ā','āte']],[/^(.+)et$/,['ent','ē','ēte']],[/^(.+)it$/,['unt','ī','īte']],
 [/^(.+)us$/,['um','ī','ō','e']],[/^(.+)um$/,['us','ī','ō','a']],
 [/^(.+)ae$/,['a','am','ā','ārum']],[/^(.+)am$/,['a','ae','ā']],
 [/^(.+)ās$/,['ae','am','ārum']],[/^(.+)ōs$/,['ī','um','ōrum']],[/^(.+)īs$/,['ō','ā','ōrum']],
 [/^(.+)ā$/,['a','am','ae']],[/^(.+)ō$/,['us','um','ī']],[/^(.+)ī$/,['us','um','ō','ōs']],
 [/^(.+)er$/,['erum','erī','erō']],[/^(.+)a$/,['am','ae','ā']],[/^(.+)e$/,['us','um','ī']]
];
function altForms(w){
  const raw=stripP(w),n=norm(raw);if(!raw)return[];
  const cap=raw[0]!==raw[0].toLowerCase();
  const g=GROUPS.find(gr=>gr.some(x=>norm(x)===n));
  if(g)return g.filter(x=>norm(x)!==n).map(x=>cap?x[0].toUpperCase()+x.slice(1):x);
  if(n.length<4||FUNC.has(n))return[];
  for(const [re,ends] of ENDS){const m=raw.match(re);if(m)return ends.map(e=>m[1]+e).filter(x=>x!==raw)}
  return[];
}
/* byNorm=true: uzunluk farkı aynı sayılır (cümle kurma). false: Italia ≠ Italiā (çoktan seçmeli) */
function smartDistractors(correctWords,vocabAll,k,byNorm=true){
  const key=byNorm?norm:(x=>x);
  const ck=correctWords.map(w=>key(stripP(w)));
  let out=[];
  correctWords.forEach(w=>altForms(w).forEach(a=>{if(!ck.includes(key(a))&&!out.some(o=>key(o)===key(a)))out.push(a)}));
  out=shuffle(out).slice(0,k);
  if(out.length<k){
    const f=shuffle(vocabAll.filter(w=>!ck.includes(key(w))&&!out.some(o=>key(o)===key(w)))).slice(0,k-out.length);
    out=out.concat(f);
  }
  return out;
}
/* Cümle kurma kontrolü: birebir sıra ya da kabul edilebilir serbest sıra */
function checkOrder(pw,cw,full){
  const pn=pw.map(norm),cn=cw.map(norm);
  if(pn.join(' ')===cn.join(' '))return 'exact';
  if(pn.length!==cn.length)return false;
  if([...pn].sort().join('|')!==[...cn].sort().join('|'))return false;
  if(/[,.?!;:»]\s/.test(full))return false;               /* çok parçalı cümle → birebir */
  for(let k=0;k<cn.length;k++){
    if(PREP.has(cn[k])){const j=pn.indexOf(cn[k]);if(j<0||pn[j+1]!==cn[k+1])return false}
    if(CONJ.has(cn[k])&&pn[k]!==cn[k])return false;
  }
  if((QW.has(cn[0])||(cn[0].length>4&&cn[0].endsWith('ne')))&&pn[0]!==cn[0])return false;
  return 'alt';
}

/* ===== Soru üreticileri ===== */
function mcqFrom(vocab,n,dir){
  return shuffle(vocab).slice(0,n).map(({w})=>{
    const d=dir==='mix'?(Math.random()<.5?'tr2la':'la2tr'):dir;
    const wrong=shuffle(vocab.filter(v=>v.w[0]!==w[0]&&v.w[1]!==w[1])).slice(0,3).map(v=>d==='tr2la'?v.w[0]:v.w[1]);
    const correct=d==='tr2la'?w[0]:w[1];
    const opts=shuffle([correct,...wrong]);
    return{prompt:d==='tr2la'?w[1]:`<span class="la">${w[0]}</span>`,opts,a:opts.indexOf(correct)};
  });
}
function sentDue(pool){
  const t=today(),all=allSent(pool);
  return{all,due:all.filter(({x})=>{const b=S.sentBoxes[x[0]];return !b||b.due<=t})};
}
function gradeSent(la,ok){
  const cur=S.sentBoxes[la]||{box:1};
  const box=ok?Math.min(6,cur.box+1):1;
  const add=[0,1,3,7,14,30][box-1]??30;
  const d=new Date();d.setDate(d.getDate()+(ok?add:0));
  S.sentBoxes[la]={box,due:d.toISOString().slice(0,10)};save();
}
function pickSents(pool,n,minWords){
  const{all,due}=sentDue(pool);
  const f=s=>!minWords||s.x[0].split(' ').length>=minWords;
  const d=shuffle(due.filter(f)),rest=shuffle(all.filter(s=>f(s)&&!d.includes(s)));
  return[...d,...rest].slice(0,n);
}
function singleWords(pool){return allVocab(pool).map(v=>v.w[0]).filter(w=>!w.includes(' ')&&!w.includes('/'))}
function blankQ(x,vocabWords){
  const toks=x[0].split(' ');
  const idxs=toks.map((t,i)=>i).filter(i=>stripP(toks[i]).length>2);
  if(!idxs.length)return null;
  const i=idxs[Math.floor(Math.random()*idxs.length)];
  const clean=stripP(toks[i]);
  const wrong=smartDistractors([clean],vocabWords,3,false);
  const opts=shuffle([clean,...wrong]);
  const blanked=toks.map((t,k)=>k===i?t.replace(clean,'<span style="color:var(--brass)">_____</span>'):t).join(' ');
  return{prompt:`<span class="la">${blanked}</span><div class="muted" style="font-size:.85rem;margin-top:6px">${x[1]}</div>`,opts,a:opts.indexOf(clean),srcLa:x[0]};
}
function sentQuestions(pool,n){
  const sents=allSent(pool);if(!sents.length)return[];
  const vw=singleWords(pool);
  return pickSents(pool,n,0).map(({x})=>{
    const k=Math.random();
    if(k>=0.7){const q=blankQ(x,vw);if(q)return q}
    if(k<0.4||k>=0.7){
      const wrong=shuffle(sents.filter(s=>s.x[0]!==x[0])).slice(0,3).map(s=>s.x[1]);
      const opts=shuffle([x[1],...wrong]);
      return{prompt:`<span class="la">${x[0]}</span>`,opts,a:opts.indexOf(x[1]),srcLa:x[0]};
    }
    const wrong=shuffle(sents.filter(s=>s.x[0]!==x[0])).slice(0,3).map(s=>s.x[0]);
    const opts=shuffle([x[0],...wrong]);
    return{prompt:x[1],opts,a:opts.indexOf(x[0]),srcLa:x[0]};
  });
}
function mixedQuestions(pool,n){
  const nS=Math.round(n*0.5),nV=n-nS;
  return shuffle([...mcqFrom(allVocab(pool),nV,'mix'),...sentQuestions(pool,nS)]);
}

/* ==================== QUIZ MOTORU ==================== */
function runQuiz(container,qs,cfg){
  let i=0,score=0;
  if(!qs.length){container.innerHTML=EMPTY_MSG;return}
  function step(){
    if(i>=qs.length){
      const pass=score>=(cfg.pass??Math.ceil(qs.length*.8));
      container.innerHTML=`<div class="res" style="color:${pass?'var(--ok)':'var(--bad)'}">${score}/${qs.length}</div>
      <p style="text-align:center">${pass?(cfg.passMsg||'Geçtin! ✅'):(cfg.failMsg||'Olmadı — biraz daha çalış, tekrar dene.')}</p>
      ${cfg.home===false?'':`<div class="row" style="justify-content:center;margin-top:10px"><button class="btn gold" onclick="nav('home')">İstasyona Dön</button></div>`}`;
      cfg.onEnd&&cfg.onEnd(score,qs.length,pass);touchStreak();$('stCount').textContent=S.streak.count;return;
    }
    const q=qs[i];
    let h=`<div class="tag">${cfg.title} • ${i+1}/${qs.length}</div><div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
    <div class="bigla">${q.prompt}</div>`;
    q.opts.forEach((o,j)=>h+=`<button class="opt" data-j="${j}">${o}</button>`);
    container.innerHTML=h;
    container.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
      const j=+btn.dataset.j;
      container.querySelectorAll('.opt').forEach(b=>b.disabled=true);
      const correct=j===q.a;
      if(correct){btn.classList.add('right');score++}
      else{btn.classList.add('wrong');container.querySelectorAll('.opt')[q.a].classList.add('right')}
      if(q.srcLa)gradeSent(q.srcLa,correct);
      setTimeout(()=>{i++;step()},correct?600:1600);
    });
  }
  step();
}

/* ==================== CÜMLE KURMA (ortak) ==================== */
function chipRound(area,sents,title,retry,vocabPool){
  if(!sents.length){area.innerHTML=EMPTY_MSG;return}
  const vocabAll=singleWords(vocabPool||doneBolums());
  let i=0,score=0;
  function show(){
    if(i>=sents.length){
      area.innerHTML=`<div class="res" style="color:${score>=sents.length*.7?'var(--ok)':'var(--bad)'}">${score}/${sents.length}</div><p style="text-align:center">${title} bitti!</p>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn gold" id="chRe">Tekrar</button></div>`;
      $('chRe').onclick=retry;touchStreak();$('stCount').textContent=S.streak.count;return}
    const x=sents[i];
    const correct=x[0].replace(/[.!?]$/,'').split(' ');
    const nD=Math.min(3,Math.max(2,Math.floor(correct.length/2)));
    const chips=shuffle([...correct,...smartDistractors(correct,vocabAll,nD,true)]);
    let picked=[];
    const bx=(S.sentBoxes[x[0]]||{box:1}).box;
    area.innerHTML=`<div class="tag">${title} • ${i+1}/${sents.length} • ${['🔴 yeni/zayıf','🟠 tanıdık','🟡 iyi','🟢 sağlam','🔵 güçlü','🟣 usta'][bx-1]}</div>
    <div class="card"><p class="muted">Bu cümleyi Latince kur:</p>
      <div class="bigla" style="font-size:1.05rem;padding:8px">${x[1]}</div>
      <div class="chipArea" id="ansArea"></div><div class="row" id="bank" style="justify-content:center"></div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn ghost" id="clrB">↺ Temizle</button><button class="btn gold" id="chkB">Kontrol Et</button><button class="btn ghost" id="skipB">Bilmiyorum</button></div>
      <div id="bRes" style="margin-top:10px"></div></div>`;
    const bank=$('bank'),ans=$('ansArea');
    chips.forEach(w=>{const b=document.createElement('button');b.className='chip';b.textContent=w;
      b.onclick=()=>{if(b.classList.contains('used'))return;b.classList.add('used');picked.push({w,el:b});draw()};bank.appendChild(b)});
    function draw(){ans.innerHTML='';ans.classList.toggle('filled',picked.length>0);
      picked.forEach((p,k)=>{const b=document.createElement('button');b.className='chip';b.textContent=p.w;
        b.onclick=()=>{p.el.classList.remove('used');picked.splice(k,1);draw()};ans.appendChild(b)})}
    $('clrB').onclick=()=>{picked.forEach(p=>p.el.classList.remove('used'));picked=[];draw()};
    $('skipB').onclick=()=>reveal(false);
    $('chkB').onclick=()=>{
      if(!picked.length)return;
      const res=checkOrder(picked.map(p=>p.w),correct,x[0]);
      Array.from(ans.children).forEach((el,k)=>el.classList.add(res==='alt'||norm(picked[k].w)===norm(correct[k]||'')?'ok':'no'));
      reveal(res);
    };
    function reveal(res){
      document.querySelectorAll('#bank .chip').forEach(b=>b.classList.add('used'));
      $('chkB').disabled=true;$('clrB').disabled=true;$('skipB').disabled=true;
      const ok=!!res;if(ok)score++;gradeSent(x[0],ok);
      let msg;
      if(res==='exact')msg='<p style="color:var(--ok);text-align:center;font-weight:600">✅ Doğru!</p>';
      else if(res==='alt')msg=`<p style="color:var(--ok);text-align:center;font-weight:600">✅ Doğru — farklı sıra</p><p class="muted" style="text-align:center;font-size:.8rem">Ekler görevi taşıdığı için sıra serbest; sadece vurgu değişir. Kitaptaki sıra:</p><div class="bigla" style="font-size:1rem">${x[0]}</div>`;
      else msg=`<p style="text-align:center;color:var(--bad);font-weight:600">Doğrusu:</p><div class="bigla" style="font-size:1rem;color:var(--ok)">${x[0]}</div>`;
      $('bRes').innerHTML=`${msg}<div class="et" style="text-align:center">SLT: ${x[2]}</div>
        <div class="row" style="justify-content:center;margin-top:10px"><button class="btn ok" id="nxB">Sıradaki →</button></div>`;
      $('nxB').onclick=()=>{i++;show()};
    }
  }
  show();
}

/* ==================== ÇEKİM DRİLLİ ==================== */
function nounCells(lv){const out=[];NOUNS.forEach(n=>CASES.forEach((c,ci)=>[0,1].forEach(num=>{if(lv>=CASE_UNLOCK[c[0]][num])out.push({n,ci,num})})));return out}
function verbCells(lv){const out=[];VERBS.forEach(v=>VFORMS.forEach((f,fi)=>{if(lv>=f[1])out.push({v,fi})}));return out}
function pickWrong(correct,unlocked,all){
  let pool=[...new Set(unlocked.filter(f=>f!==correct))];
  if(pool.length<3)pool=pool.concat(shuffle([...new Set(all.filter(f=>f!==correct&&!pool.includes(f)))]).slice(0,3-pool.length));
  return shuffle(pool).slice(0,3);
}
function declQuestions(n,kind){
  const lv=doneMax(),nc=nounCells(lv),vc=verbCells(lv),qs=[];
  for(let k=0;k<n;k++){
    const useVerb=vc.length&&(kind==='verb'||(kind==='mix'&&Math.random()<.35));
    if(useVerb){
      const c=vc[Math.floor(Math.random()*vc.length)],correct=c.v.f[c.fi];
      const unl=vc.filter(x=>x.v===c.v).map(x=>x.v.f[x.fi]);
      const opts=shuffle([correct,...pickWrong(correct,unl,c.v.f)]);
      qs.push({prompt:`<span class="la">${c.v.lem}</span> <span class="muted">(${c.v.info})</span><div class="muted" style="font-size:.95rem;margin-top:6px">→ <b style="color:var(--ink)">${VFORMS[c.fi][0]}</b></div>`,opts,a:opts.indexOf(correct)});
    }else if(nc.length){
      const c=nc[Math.floor(Math.random()*nc.length)],correct=(c.num?c.n.pl:c.n.sg)[c.ci];
      const unl=nc.filter(x=>x.n===c.n).map(x=>(x.num?x.n.pl:x.n.sg)[x.ci]);
      const opts=shuffle([correct,...pickWrong(correct,unl,c.n.sg.concat(c.n.pl))]);
      qs.push({prompt:`<span class="la">${c.n.lem}</span> <span class="muted">(${c.n.info})</span><div class="muted" style="font-size:.95rem;margin-top:6px">→ <b style="color:var(--ink)">${CASES[c.ci][1]} · ${c.num?'Çoğul':'Tekil'}</b></div>`,opts,a:opts.indexOf(correct)});
    }
  }
  return qs;
}

function allErrors(){
  return ERR_SEED.map(e=>({...e,st:S.errors[e.id]})).concat(S.customErrors.map((e,idx)=>({id:'c'+idx,title:e.title,items:e.items,st:e})));
}
function renderErrors(){
  const list=allErrors();
  let h=list.length?'':'<div class="card muted" style="text-align:center">Henüz kayıtlı hata yok.<br>Derste tekrarlayan bir hata yakalayınca <b>+ Hata Ekle</b> ile buraya düş.</div>';
  list.forEach(e=>{
    const dots=[0,1,2].map(i=>`<i class="${i<e.st.streak?'on':''}"></i>`).join('');
    h+=`<div class="errit ${e.st.cleared?'clr':''}">${e.st.cleared?'✅':'⚠️'} <b>${e.title}</b><span class="dots">${dots}</span></div>`;
  });
  $('errList').innerHTML=h;$('errDrillArea').innerHTML='';
}
$('errDrillBtn').onclick=()=>{
  const act=allErrors().filter(e=>!e.st.cleared);
  if(!act.length){$('errDrillArea').innerHTML='<div class="card" style="text-align:center">🎉 Liste temiz — aktif hata yok!</div>';return}
  const qs=shuffle(act).map(e=>{const it=e.items[Math.floor(Math.random()*e.items.length)];return{prompt:it.q,opts:it.opts,a:it.a,eid:e.id}});
  let i=0;
  function step(){
    if(i>=qs.length){S.daily.drill++;save();renderErrors();$('errDrillArea').innerHTML='<div class="card" style="text-align:center">✅ Drill bitti!</div>';touchStreak();$('stCount').textContent=S.streak.count;return}
    const q=qs[i];
    let h=`<div class="tag">Hata Drilli • ${i+1}/${qs.length}</div><div class="bigla" style="font-size:1.15rem">${q.prompt}</div>`;
    q.opts.forEach((o,j)=>h+=`<button class="opt" data-j="${j}">${o}</button>`);
    $('errDrillArea').innerHTML=h;
    document.querySelectorAll('#errDrillArea .opt').forEach(btn=>btn.onclick=()=>{
      const j=+btn.dataset.j;
      document.querySelectorAll('#errDrillArea .opt').forEach(b=>b.disabled=true);
      const est=q.eid.startsWith('c')?S.customErrors[+q.eid.slice(1)]:S.errors[q.eid];
      if(j===q.a){btn.classList.add('right');est.streak++;if(est.streak>=3)est.cleared=true}
      else{btn.classList.add('wrong');document.querySelectorAll('#errDrillArea .opt')[q.a].classList.add('right');est.streak=0}
      save();setTimeout(()=>{i++;step()},j===q.a?600:1600);
    });
  }
  step();
};

function renderWeakExam(){
  const pool=doneBolums();
  const weakV=allVocab(pool).filter(({w})=>{const b=S.boxes[w[0]];return !b||b.box<=2});
  const weakS=allSent(pool).filter(({x})=>{const b=S.sentBoxes[x[0]];return b&&b.box<=2});
  if(weakV.length<4&&weakS.length<2){$('examArea').innerHTML='<div class="card" style="text-align:center">🎉 Zayıf noktan kalmamış!<br><span class="muted">Kartlarda ve cümle kurmada çalıştıkça bu liste güncellenir.</span></div>';return}
  $('examArea').innerHTML=`<div class="card"><b>🎯 Zayıf Noktalar</b>
    <p class="muted" style="margin:6px 0 12px">Zorlandığın malzeme:<br>• <b>${weakV.length}</b> kelime &nbsp;•&nbsp; <b>${weakS.length}</b> cümle</p>
    <div class="row"><button class="btn gold" id="wkMix">Karışık Tur</button>
      ${weakS.length>=3?'<button class="btn" id="wkBuild">🧩 Zayıf Cümleleri Kur</button>':''}</div></div>`;
  $('wkMix').onclick=()=>{
    const vq=mcqFrom(weakV.length>=4?weakV:allVocab(pool),Math.min(12,Math.max(4,weakV.length)),'mix');
    const sq=weakS.length?sentQuestions(pool,Math.min(8,weakS.length)):[];
    runQuiz($('examArea'),shuffle([...vq,...sq]).slice(0,20),{title:'Zayıf Noktalar',passMsg:'🎉 Zayıf noktalar güçleniyor!',failMsg:'Bu malzeme biraz daha tekrar istiyor.'});
  };
  if($('wkBuild'))$('wkBuild').onclick=()=>{go('sprint');chipRound($('sprintArea'),shuffle(weakS.map(s=>s.x)).slice(0,10),'Zayıf cümleler',()=>{examTab='weak';go('exam')})};
}

load();
</script>
</body>
</html>
